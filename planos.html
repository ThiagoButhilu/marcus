<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planos e valores | Marcus Thomaz, personal trainer</title>
    <meta name="description" content="Planos do Marcus Thomaz: personal presencial ou on-line, small group e consultoria com ou sem nutrição. Valores, condições e contratação pelo WhatsApp." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Planos e valores | Marcus Thomaz" />
    <meta property="og:description" content="Personal presencial ou on-line, small group e consultoria. Monte o seu plano e contrate pelo WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23000000'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='900' text-anchor='middle' fill='%2398b7ba' font-family='Arial Black,Arial,sans-serif'%3EMT%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500..800&family=Jost:wght@400..700&display=swap" rel="stylesheet" />
  </head>

  <body class="antialiased">
    <a href="#montar" class="fixed left-3 top-3 z-[60] -translate-y-20 rounded-full bg-tinta px-4 py-2 font-semibold text-gelo focus:translate-y-0">Pular para o conteúdo</a>

    <!-- topo da página de planos: fixo, sempre escuro -->
    <header id="nav" data-tone="dark" class="tone-dark sticky top-0 z-40 bg-tinta text-gelo">
      <div class="mx-auto flex max-w-[110rem] items-center justify-between gap-3 px-4 py-3 md:px-8">
        <a href="./" class="relative block w-[5.5rem] md:w-24" aria-label="Marcus Thomaz, início">
          <span class="brand-mark w-full" aria-hidden="true"></span>
        </a>
        <div class="flex items-center gap-2">
          <a class="pill max-sm:hidden" href="./">← Voltar ao site</a>
          <div class="lang" role="group" aria-label="Idioma">
            <button type="button" data-lang="pt" lang="pt-BR" aria-label="Português (Brasil)">PT</button>
            <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
          </div>
          <a id="top-wa" class="btn btn-hot !px-5 !py-3 max-md:hidden" href="#" target="_blank" rel="noopener">Falar com o Marcus</a>
        </div>
      </div>
    </header>

    <main>
      <!-- abertura -->
      <section class="tone-dark bg-tinta px-4 pb-16 pt-14 text-gelo md:px-8 md:pb-24 md:pt-24">
        <div class="mx-auto max-w-[96rem]" id="plans-hero"></div>
      </section>

      <!-- montador: modalidade, detalhes e valor -->
      <section id="montar" class="bg-gelo px-4 py-16 md:px-8 md:py-24">
        <div class="mx-auto max-w-[96rem]" id="builder"></div>
      </section>

      <!-- tabela completa -->
      <section id="tabela" class="bg-white px-4 py-16 md:px-8 md:py-24">
        <div class="mx-auto max-w-[96rem]" id="price-table"></div>
      </section>

      <!-- fases do programa e parceiros -->
      <section id="incluido" class="bg-bruma px-4 py-16 md:px-8 md:py-24">
        <div class="mx-auto max-w-[96rem]" id="phases"></div>
      </section>

      <!-- locais -->
      <section id="onde" class="tone-dark bg-petroleo px-4 py-16 text-gelo md:px-8 md:py-24">
        <div class="mx-auto max-w-[96rem]" id="places"></div>
      </section>

      <!-- condições e regras -->
      <section id="regras" class="bg-gelo px-4 py-16 md:px-8 md:py-24">
        <div class="mx-auto max-w-[96rem]" id="rules"></div>
      </section>

      <!-- fechamento -->
      <section class="tone-dark bg-tinta px-4 py-20 text-gelo md:px-8 md:py-28">
        <div class="mx-auto max-w-[96rem]" id="final"></div>
      </section>
    </main>

    <footer class="tone-dark bg-tinta px-4 pb-10 pt-4 text-gelo md:px-8">
      <div class="mx-auto flex max-w-[96rem] flex-wrap items-center justify-between gap-4 border-t border-white/15 pt-8 text-sm">
        <p class="opacity-70">© 2026 Marcus Thomaz, personal trainer</p>
        <a class="pill" href="./">← Voltar ao site</a>
      </div>
    </footer>

    <script type="module" src="/src/planos.js"></script>
  </body>
</html>
